issueTrackerURL = "https://github.com/NikKonakov/EF-Sorcery/issues"

[[mods]]
modId = "${modId}"
version = "${modVersion}"
displayName = "Epic Fight: Sorcery"
authors = "Niksol841"
description = '''Adds a Sorcerer subclass to Epic Fight: Cursed Energy infusion, cursed energy combos and black flash.'''

[[dependencies."${modId}"]]
    modId = "neoforge"
    type = "required"
    versionRange = "[${neoforgeVersion},)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies."${modId}"]]
    modId = "minecraft"
    type = "required"
    versionRange = "[${minecraft}]"
    ordering = "NONE"
    side = "BOTH"

[[dependencies."${modId}"]]
    modId = "epicfight"
    type = "required"
    versionRange = "[21.17.3,)"
    ordering = "AFTER"
    side = "BOTH"
